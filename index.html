<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone + Musicolet Lyrics</title>
    <!-- Iconos oficiales de Google Fonts -->
    <link rel="stylesheet" href="https://googleapis.com" />
    <style>
        :root {
            --bg-main: #000000;
            --bg-sidebar: #121212;
            --bg-player: #181818;
            --spotify-green: #1db954;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 90px);
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            margin: 8px 0 8px 8px;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        .search-box {
            display: flex;
            background: #242424;
            border-radius: 50px;
            padding: 10px 15px;
            align-items: center;
            border: 1px solid transparent;
        }
        .search-box:focus-within {
            border-color: #fff;
        }
        .search-box input {
            background: none;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            margin-left: 10px;
            font-size: 14px;
        }

        .results-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .result-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            gap: 12px;
            margin-bottom: 5px;
            transition: background 0.2s;
        }
        .result-item:hover {
            background-color: #2a2a2a;
        }
        .result-item img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
        }
        .result-item .info {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .result-item .title { font-size: 14px; font-weight: bold; color: #fff; }
        .result-item .author { font-size: 12px; color: var(--text-muted); }

        .main-content {
            flex: 1;
            background: linear-gradient(to bottom, #1c281f, #121212);
            margin: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #282828;
            padding-bottom: 15px;
        }
        .lyrics-toggle-btn {
            background: #282828;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }
        .lyrics-toggle-btn.active {
            background: var(--spotify-green);
            color: black;
        }

        .lyrics-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .lyrics-scroll-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .lrc-line {
            opacity: 0.3;
            transform: scale(0.9);
            transition: all 0.3s ease;
            margin: 20px 0;
            cursor: pointer;
            font-size: 26px;
            font-weight: 700;
        }
        .lrc-line.active {
            opacity: 1;
            color: var(--spotify-green);
            transform: scale(1.05);
        }

        .plain-text-lyrics {
            font-size: 18px;
            font-weight: 400;
            white-space: pre-line;
            color: var(--text-muted);
            text-align: left;
            width: 100%;
            max-width: 600px;
            line-height: 1.8;
        }

        .player-bar {
            height: 90px;
            background-color: var(--bg-player);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .track-info {
            display: flex;
            align-items: center;
            width: 30%;
            gap: 15px;
        }
        #current-thumb { width: 56px; height: 56px; border-radius: 4px; background: #282828; object-fit: cover; }
        .track-details { overflow: hidden; }
        .track-details .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-details .artist { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
            gap: 8px;
        }
        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .control-buttons button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-buttons button:hover { color: #fff; }
        .control-buttons .play-btn {
            background: #fff;
            color: #000;
            border-radius: 50%;
            width: 36px;
            height: 36px;
        }
        .control-buttons .play-btn:hover {
            transform: scale(1.05);
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: #4f4f4f;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            border-radius: 2px;
        }
        .progress-bar:hover .progress-fill {
            background: var(--spotify-green);
        }

        #yt-hidden-player {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 200px;
            height: 200px;
            opacity: 0.01; /* Evita que el navegador detenga la carga por estar oculto del todo */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="search-box">
                <span class="material-symbols-rounded" style="color: var(--text-muted)">search</span>
                <input type="text" id="search-input" placeholder="Buscar música y presionar Enter...">
            </div>
            <ul class="results-list" id="results-list"></ul>
        </div>

        <div class="main-content">
            <div class="lyrics-header">
                <div id="playing-title-top" style="font-weight: bold; font-size: 18px;">Ninguna canción en reproducción</div>
                <div>
                    <button class="lyrics-toggle-btn active" id="btn-sync" onclick="setLyricsMode('sync')">Sincronizada (LRC)</button>
                    <button class="lyrics-toggle-btn" id="btn-plain" onclick="setLyricsMode('plain')">Texto Plano</button>
                </div>
            </div>
            
            <div class="lyrics-body" id="lyrics-display">
                <div style="color: var(--text-muted); font-size: 16px; margin-top: 40px;">Busca una canción en el panel izquierdo y selecciónala para iniciar.</div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="track-info">
            <img id="current-thumb" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
            <div class="track-details">
                <div class="title" id="player-title">Título de la canción</div>
                <div class="artist" id="player-artist">Artista / Canal</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="material-symbols-rounded">shuffle</button>
                <button class="material-symbols-rounded">skip_previous</button>
                <button class="play-btn" onclick="togglePlay()">
                    <span class="material-symbols-rounded" id="play-icon">play_arrow</span>
                </button>
                <button class="material-symbols-rounded">skip_next</button>
                <button class="material-symbols-rounded">repeat</button>
            </div>
            <div class="progress-container">
